name: Conditional other fields

on:
  push:
    paths:
      - .github/workflows/conditional-other-fields.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add conditional Other fields
        run: |
          python -c "from pathlib import Path; import base64; p=Path('index.html'); s=p.read_text(encoding='utf-8'); marker='<!-- conditional-other-fields -->'; script=base64.b64decode('').decode(); p.write_text(s if marker in s else s.replace('</body>', script+'\\n</body>',1), encoding='utf-8')"
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Show Other fields conditionally [skip ci]"
          git push
