name: Remove optional select placeholder

on:
  push:
    paths:
      - .github/workflows/remove-optional-select-placeholder.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove visible placeholder from optional selects
        run: python -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); s=s.replace('<option value=\"\">— выберите —</option>', '<option value=\"\"></option>'); p.write_text(s, encoding='utf-8')"
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove optional select placeholder [skip ci]"
          git push
