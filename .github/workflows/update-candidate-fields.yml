name: Update candidate fields

on:
  push:
    paths:
      - .github/workflows/update-candidate-fields.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply requested form changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          candidate_pattern = r'<section class="card"><h2>Кандидат</h2><div class="grid3">.*?</section>'
          candidate_new = '''<section class="card"><h2>Кандидат</h2><div class="grid"><div><label class="block">Кандидат</label><input name="candidate" type="text" placeholder="Имя и фамилия или привычное имя" title="Как подписать кандидата в списке"></div><div><label class="block">Ссылка / связь</label><input name="contact" type="text" placeholder="Telegram, VK, телефон или ссылка" title="Как связаться с кандидатом"></div><div><label class="block">Возраст</label><input name="age" type="text" inputmode="numeric" placeholder="Например: 27" title="Возраст кандидата"></div><div><label class="block">Дата</label><input name="date" type="date"></div><div><label class="block">Собеседующий</label><input name="interviewer" type="text" placeholder="Кто проводит собеседование" title="Имя собеседующего"></div></div></section>'''
          s, n = re.subn(candidate_pattern, candidate_new, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('candidate block not found')

          if "'Daggerheart','Fate','Cyberpunk'" not in s:
              if "'Daggerheart','Cyberpunk'" not in s:
                  raise SystemExit('systems list pattern not found')
              s = s.replace("'Daggerheart','Cyberpunk'", "'Daggerheart','Fate','Cyberpunk'", 1)

          booking_pattern = r'<label class="block" style="margin-top:14px">Может стабильно заранее бронировать игровые слоты</label><select name="stable_booking">.*?</select>'
          s, n = re.subn(booking_pattern, '', s, count=1, flags=re.S)
          if n != 1 and 'stable_booking' in s:
              raise SystemExit('booking block not removed')

          old_header = "[line('Дата',d.date),line('Собеседующий',d.interviewer)].filter(Boolean).join(' | ')"
          new_header = "[line('Связь',d.contact),line('Возраст',d.age),line('Дата',d.date),line('Собеседующий',d.interviewer)].filter(Boolean).join(' | ')"
          if old_header in s:
              s = s.replace(old_header, new_header, 1)
          elif new_header not in s:
              raise SystemExit('summary header not found')

          s = s.replace(",line('Бронирование слотов',d.stable_booking)", '', 1)
          s = s.replace("line('Новички',d.rating_newbies)", "line('Работа с новичками',d.rating_newbies)", 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update candidate fields and systems [skip ci]"
          git push
