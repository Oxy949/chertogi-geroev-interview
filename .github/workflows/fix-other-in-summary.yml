name: Fix Other values in summary

on:
  push:
    paths:
      - .github/workflows/fix-other-in-summary.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix summary output
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="line('Водил',d.systems),line('Основная',d.main_system),line('Уверенно ведёт',d.confident_systems),line('Хотел бы освоить',d.learn_systems),line('Особенности',d.systems_notes)"
          new="line('Водил',d.systems),line('Другая система',d.other_system),line('Основная',d.main_system),line('Уверенно ведёт',d.confident_systems),line('Хотел бы освоить',d.learn_systems),line('Особенности',d.systems_notes)"
          if old not in s:
              raise SystemExit('systems summary pattern not found')
          s=s.replace(old,new,1)
          s=s.replace("line('Приключения',d.sources),line('Другое',d.source_other)","line('Приключения',d.sources),line('Другой источник',d.source_other)",1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Include Other field values in summary [skip ci]"
          git push
