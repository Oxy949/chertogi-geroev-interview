name: Sync regulation tab

on:
  push:
    paths:
      - .github/workflows/sync-regulation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make regulation tab render Markdown source
        shell: bash
        run: |
          cat > /tmp/patch.py <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          replacement = '<div id="view-regulation" class="view"><main style="display:block"><article class="card reg" id="regContent"><p class="small">Загрузка регламента…</p></article></main></div>'
          pattern = r'<div id="view-regulation" class="view">.*?</div>\s*\n\s*<footer>'
          s, count = re.subn(pattern, replacement + '\n\n<footer>', s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Expected one regulation block, replaced {count}')

          loader = r'''<script>
          function regulationEscape(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
          function regulationInline(s){return regulationEscape(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')}
          function renderRegulationMarkdown(md){
            const lines=md.replace(/\r/g,'').split('\n'),out=[];let list=null;
            const close=()=>{if(list){out.push(list==='ul'?'</ul>':'</ol>');list=null}};
            for(const raw of lines){
              const line=raw.trimEnd();
              if(/^\d+\.\s+/.test(line)){if(list!=='ol'){close();out.push('<ol>');list='ol'}out.push('<li>'+regulationInline(line.replace(/^\d+\.\s+/,''))+'</li>');continue}
              if(/^-\s+/.test(line)){if(list!=='ul'){close();out.push('<ul>');list='ul'}out.push('<li>'+regulationInline(line.replace(/^-\s+/,''))+'</li>');continue}
              close();
              if(!line.trim())continue;
              if(line.trim()==='---'){out.push('<hr>');continue}
              if(line.startsWith('### ')){out.push('<h3>'+regulationInline(line.slice(4))+'</h3>');continue}
              if(line.startsWith('## ')){out.push('<h2>'+regulationInline(line.slice(3))+'</h2>');continue}
              if(line.startsWith('# ')){out.push('<h1>'+regulationInline(line.slice(2))+'</h1>');continue}
              out.push('<p>'+regulationInline(line)+'</p>');
            }
            close();return out.join('\n');
          }
          async function loadRegulation(){
            const root=document.getElementById('regContent');if(!root)return;
            try{const r=await fetch('hiring-regulations.md',{cache:'no-cache'});if(!r.ok)throw new Error(r.status);root.innerHTML=renderRegulationMarkdown(await r.text())}
            catch(e){root.innerHTML='<p>Не удалось загрузить регламент. Обновите страницу.</p>'}
          }
          loadRegulation();
          </script>'''

          if 'function loadRegulation()' not in s:
              s = s.replace('<footer>', loader + '\n<footer>', 1)

          p.write_text(s, encoding='utf-8')
          PY
          python /tmp/patch.py
      - name: Commit site update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Render regulation from Markdown source [skip ci]"
          git push
