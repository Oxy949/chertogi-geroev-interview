name: Strict checklist form sync

on:
  push:
    paths:
      - .github/workflows/strict-checklist-form.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply canonical checklist order and hints
        shell: bash
        run: |
          cat > /tmp/patch.py <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<title>Собеседования мастеров НРИ — Чертоги Героев</title>', '<title>Собеседование мастера НРИ в клуб ЧГ</title>')
          s = s.replace('<h1>Собеседования мастеров НРИ — Чертоги Героев</h1>', '<h1>Собеседование мастера НРИ в клуб ЧГ</h1>')
          section1 = (
              '<section class="card"><h2>1. Доступность</h2>'
              '<h3>Откуда добирается</h3>'
              '<div class="grid">'
              '<div><label class="block">Район / метро</label><input name="area" type="text" placeholder="Например: м. Петроградская / район" title="Откуда кандидат обычно будет добираться до клуба"></div>'
              '<div><label class="block">Дорога до клуба</label><select name="commute"><option value="">— выберите —</option><option>до 30 минут</option><option>30–45 минут</option><option>45–60 минут</option><option>больше часа</option></select></div>'
              '<div><label class="block">Регулярно ездить</label><select name="commute_ok"><option value="">— выберите —</option><option>комфортно</option><option>допустимо</option><option>потенциальная проблема</option></select></div>'
              '</div>'
              '<h3>Основная занятость</h3>'
              '<div class="grid">'
              '<div><label class="block">Занятость</label><select name="employment"><option value="">— выберите —</option><option>постоянная работа</option><option>временная / проектная работа</option><option>фриланс / самозанятость</option><option>учёба</option><option>работа + учёба</option><option>сейчас не работает</option><option>мастер НРИ</option><option>другое</option></select></div>'
              '<div><label class="block">Другое</label><input name="employment_other" type="text" placeholder="Если выбрано «другое»"></div>'
              '<div><label class="block">График основной занятости</label><select name="work_schedule"><option value="">— выберите —</option><option>стандартный 5/2</option><option>сменный</option><option>гибкий</option><option>плавающий / меняется каждую неделю</option><option>свободный</option><option>другое</option></select></div>'
              '<div><label class="block">Другой график</label><input name="work_schedule_other" type="text" placeholder="Если выбрано «другое»"></div>'
              '</div>'
              '<h3>Важные особенности работы или места жительства</h3>'
              '<textarea name="work_location_notes" placeholder="Например: удалёнка, смены, поздно заканчивает работу, далеко ехать после смены" title="Факторы работы или места жительства, которые могут влиять на регулярность"></textarea>'
              '<h3>Когда может водить в клубе</h3>'
              '<label class="block">Дни</label><div class="choices" data-multi="days"></div>'
              '<label class="block" style="margin-top:12px">Время</label><div class="choices" data-multi="time"></div>'
              '<h3>Насколько заранее известен график ведения?</h3>'
              '<select name="schedule_notice"><option value="">— выберите —</option><option>месяц и более</option><option>2–4 недели</option><option>примерно за неделю</option><option>становится известен за несколько дней</option><option>сильно меняется / сложно прогнозировать</option></select>'
              '<label class="block" style="margin-top:14px">Может стабильно заранее бронировать игровые слоты</label>'
              '<select name="stable_booking"><option value="">— выберите —</option><option>да</option><option>в большинстве случаев</option><option>зависит от графика</option><option>скорее нет</option></select>'
              '<label class="block" style="margin-top:14px">Ограничения / важные детали</label>'
              '<input name="availability_details" type="text" placeholder="Например: не может по средам; нужен фиксированный график" title="Короткие ограничения по расписанию">'
              '<h3>Планируемая регулярность ведения</h3>'
              '<select name="frequency"><option value="">— выберите —</option><option>1–2 игры в месяц</option><option>1 игра в неделю</option><option>2 игры в неделю</option><option>3+ игр в неделю</option><option>зависит от загрузки</option></select>'
              '<label class="block" style="margin-top:14px">Комфортная нагрузка</label>'
              '<input name="comfortable_load" type="text" placeholder="Например: 1–2 игры в неделю" title="Сколько игр кандидат реально считает комфортной нагрузкой">'
              '<h3>Важные особенности ведения в клубе</h3>'
              '<textarea name="club_availability_notes" placeholder="Например: предпочитает дневные игры, готов фиксировать слоты на месяц вперёд" title="Любые организационные особенности, которые важно помнить"></textarea>'
              '</section>'
          )
          s, n = re.subn(r'<section class="card"><h2>1\. Доступность</h2>.*?</section>\s*<section class="card"><h2>2\. Опыт в НРИ</h2>', section1 + '<section class="card"><h2>2. Опыт в НРИ</h2>', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'Availability replacement failed: {n}')
          s = s.replace('<div><label class="block">Основная занятость</label><select name="employment">', '<div><label class="block">Основная занятость</label><select name="employment">')
          s = s.replace('<h3>Жанры</h3><div class="choices" data-multi="genres"></div><h3>Формат</h3>', '<h3>Жанры</h3><div class="choices" data-multi="genres"></div><label class="block" style="margin-top:12px">Другой жанр</label><input name="genre_other" type="text" placeholder="Если выбрано «другое»"><h3>Формат</h3>')
          s = s.replace('<h3>Свои приключения или готовые модули?</h3><div class="choices" data-multi="sources"></div><label class="block" style="margin-top:14px">Что готов поставить', '<h3>Свои приключения или готовые модули?</h3><div class="choices" data-multi="sources"></div><label class="block" style="margin-top:12px">Другое</label><input name="source_other" type="text" placeholder="Если выбрано «другое»"><label class="block" style="margin-top:14px">Что готов поставить')
          s = re.sub(r",checks:\[[^\]]*\]", '', s, count=1)
          s = s.replace("line('Занятость',d.employment),line('График работы',d.work_schedule)", "line('Занятость',d.employment),line('Другая занятость',d.employment_other),line('График работы',d.work_schedule),line('Другой график',d.work_schedule_other)")
          if "line('Важные особенности работы / места жительства',d.work_location_notes)" not in s:
              s = s.replace("line('Комфортная нагрузка',d.comfortable_load),line('Ограничения / детали',d.availability_details)", "line('Важные особенности работы / места жительства',d.work_location_notes),line('Комфортная нагрузка',d.comfortable_load),line('Ограничения / детали',d.availability_details)")
          s = s.replace("line('Жанры',d.genres),line('Формат',d.formats),line('Приключения',d.sources)", "line('Жанры',d.genres),line('Другой жанр',d.genre_other),line('Формат',d.formats),line('Приключения',d.sources),line('Другое',d.source_other)")
          p.write_text(s, encoding='utf-8')
          PY
          python /tmp/patch.py
      - name: Commit strict form
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make site strictly follow interview checklist [skip ci]"
          git push
