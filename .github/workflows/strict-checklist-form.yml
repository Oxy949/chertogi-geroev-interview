name: Canonical regulation sync

on:
  push:
    paths:
      - .github/workflows/strict-checklist-form.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace regulation with canonical source
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > hiring-regulations.md
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<label class="block">Имя кандидата</label>','<label class="block">Кандидат</label>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit canonical regulation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html hiring-regulations.md
          git commit -m "Use canonical checklist and regulation text [skip ci]"
          git push
